<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="git-mcp - local git, no push, stdio">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15202b"/>
      <stop offset="55%" stop-color="#1c2a38"/>
      <stop offset="100%" stop-color="#243746"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8a317"/>
      <stop offset="100%" stop-color="#f0b429"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4f60"/>
      <stop offset="100%" stop-color="#2a3a48"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="48%" r="28%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fa3b4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#sky)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="980" cy="210" rx="280" ry="160" fill="url(#glow)"/>

  <g transform="translate(72,56)">
    <text x="0" y="64" fill="#f4f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" letter-spacing="-1">git-mcp</text>
    <text x="2" y="104" fill="#e8a317" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">LOCAL GIT  &#183;  NO PUSH  &#183;  STDIO</text>
  </g>

  <g transform="translate(680,128)" filter="url(#soft)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="18" fill="#9fb3c5" font-size="13">main</text>
    <line x1="64" y1="14" x2="470" y2="14" stroke="#f0b429" stroke-width="4" stroke-linecap="round"/>
    <circle cx="90" cy="14" r="9" fill="#15202b" stroke="#f0b429" stroke-width="3"/>
    <circle cx="250" cy="14" r="9" fill="#15202b" stroke="#f0b429" stroke-width="3"/>
    <circle cx="430" cy="14" r="11" fill="#f0b429"/>
    <text x="430" y="-10" text-anchor="middle" fill="#f4f7fa" font-size="12" font-weight="700">HEAD</text>

    <path d="M250 23 C250 78, 320 78, 340 112" fill="none" stroke="#8fa3b4" stroke-width="3" stroke-linecap="round"/>
    <line x1="340" y1="112" x2="470" y2="112" stroke="#8fa3b4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="370" cy="112" r="8" fill="#15202b" stroke="#c9d7e3" stroke-width="3"/>
    <circle cx="470" cy="112" r="8" fill="#15202b" stroke="#c9d7e3" stroke-width="3"/>
    <text x="0" y="118" fill="#6f8799" font-size="13">topic</text>
  </g>

  <g transform="translate(700,292)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">
    <rect width="118" height="28" rx="6" fill="url(#card)" stroke="#6f8799"/>
    <text x="59" y="19" text-anchor="middle" fill="#c9d7e3">status_get</text>
    <g transform="translate(130,0)">
      <rect width="100" height="28" rx="6" fill="url(#card)" stroke="#6f8799"/>
      <text x="50" y="19" text-anchor="middle" fill="#c9d7e3">diff_get</text>
    </g>
    <g transform="translate(242,0)">
      <rect width="132" height="28" rx="6" fill="#3f5870" stroke="#f0b429"/>
      <text x="66" y="19" text-anchor="middle" fill="#f4f7fa">commit_create</text>
    </g>
  </g>

  <g transform="translate(72,292)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="168" height="36" rx="6" fill="#3a2a2a" stroke="#c45c4a"/>
    <text x="84" y="24" text-anchor="middle" fill="#e7b2a8" font-size="14" font-weight="700">push refused</text>
  </g>
</svg>
